name: pr gate
# pull_request_target: a fork's token is read-only, so its comment would do
# nothing. The action reads the PR base template, runs no PR code, and
# synchronize re-runs it per push. Not the README block: this file's
# comment-share record caps it.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: write
concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  gate:
    # Bot-authored pull requests are not gated: GitHub reports a skipped
    # job's check as success. drafts: skip skips a draft its event and
    # live state agree on.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Nitjsefnie-Actions/pr-gate@6a010a2f189408577577393de31ab46f9654483a # v4.1.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pull-request-number: ${{ github.event.pull_request.number }}
          pull-request-author: ${{ github.event.pull_request.user.login }}
          require-commit-attribution: 'true'
          drafts: skip
