name: pr gate
# pull_request_target: a fork's token is read-only, so its comment would do
# nothing. The action reads the PR base template, runs no PR code, and
# synchronize re-runs it per push. Not the README block: this file's
# comment-share record caps it.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: write
concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  gate:
    # Bot-authored pull requests are not gated, and a draft is checked when
    # it is marked ready for review. GitHub reports a skipped job's check as
    # success, so neither blocks a merge.
    if: >-
      github.event.pull_request.user.type != 'Bot'
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Nitjsefnie-Actions/pr-gate@eb4991d7f92be7d2e55bb8b47aaaa24f09e98ca2 # v3.3.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pull-request-number: ${{ github.event.pull_request.number }}
          pull-request-author: ${{ github.event.pull_request.user.login }}
          require-commit-attribution: 'true'
