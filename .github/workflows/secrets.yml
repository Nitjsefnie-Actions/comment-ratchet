name: secrets

# The daily full-history re-answer. tests.yml calls this same scanner on
# every pull request and every push to main, so a secret reaching a PR or
# main is caught in the aggregate. The schedule exists for the commits that run can never see: ones that landed
# before those workflows did, ones pushed with [skip ci], and any whose secret
# only becomes detectable when the frozen scanner's rules improve with a
# version bump. The cron re-answers for the whole history each morning, so
# such a commit is caught the next day rather than never.
#
# Contribution events belong to tests.yml, whose aggregate needs this leg;
# workflow_call avoids a second run of the same commit under another ref.
# The schedule re-answers for history the contribution gate cannot revisit.
#
# THE BINARY IS FROZEN BY HAND. The version is pinned and digest-verified, so
# no run ever scans with a silently changed scanner — and every bump rescans
# the whole history under the new rules, which is the price of the bump. The
# scanner is the binary rather than gitleaks-action because that action
# requires a GITLEAKS_LICENSE secret on organization accounts, and this
# repository's org would have to hold one just to be scanned.
#
# NO CONFIG FILE. No .gitleaks.toml is committed and no --config is passed:
# the default ruleset ran clean against this repository's full history, so an
# allowlist here would be a way to silence a future finding nobody reviewed.

on:
  workflow_call:
  schedule:
    # Off the hour, split from this repository's other crons: codeql runs
    # Wednesdays 03:47, scorecard Saturdays 02:23.
    - cron: '41 4 * * *'

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the scan reads `git log -p`, so a shallow clone
          # would scan a suffix of history and call the rest clean.
          fetch-depth: 0
          # Nothing pushes; the job token must not survive the checkout.
          persist-credentials: false

      - name: Download gitleaks and verify its digest
        # Checksum-verified rather than piped from an install script: `curl |
        # bash` would make this job trust whatever that URL serves at run
        # time. The digest is from the release's own checksums file, and a
        # this reusable workflow keeps one pin for scheduled and PR scans.
        run: |
          curl --connect-timeout 5 --max-time 120 -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks

      - name: Scan the tree and the history
        # Bare on purpose: this step's exit status IS the gate, so no
        # condition, fallback or error-swallowing suffix belongs here. The
        # log is public: --verbose names findings, --redact masks them.
        run: ./gitleaks detect --verbose --redact
