name: tests

# Linux-only checks cannot establish macOS portability. Both POSIX legs run
# the same real-subprocess suite with Python and the locked JS tokenizer.
# Contribution events live here so one aggregate can need every gate leg;
# size-baseline.yml is size-ratchet's install block and reports on its own.
#
# No freshness or commit-scope step: their scripts and suites cannot fit the
# tests/ tree budget at its record, so they land in a separate PR.
on:
  push:
    # A PR head already runs below; an unfiltered push would duplicate it.
    branches: [main]
  # Required checks must report on every PR; a path filter would block it.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing pushes; later steps must not inherit a stored token.
          persist-credentials: false
      # ShellCheck ships with the image; a missing binary fails in seconds.
      - name: Check every shell file
        # Recurse so a nested test helper cannot silently escape lint.
        run: find tests -type f -name '*.sh' -exec shellcheck {} +

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        uses: Nitjsefnie-Actions/test-ratchet/plan@96562a47e9b7fe74b55cc70a4636d1b5d7b542e2 # v2.4.2
        with:
          tests: tests/**/test_*.py
          times: .github/test-times.json
          shards: 1

  test:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.15 only: the action itself runs 3.15, so a 3.14 cell would test
        # an interpreter it never uses.
        python: ['3.15']
        shard: ${{ fromJSON(needs.plan.outputs.matrix).shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing pushes; keep the token out of .git/config.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Install the regression toolchain
        # --require-hashes pins artifacts; npm ci verifies its lockfile.
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r requirements-test.txt
          npm ci --ignore-scripts --no-audit --no-fund
      - uses: Nitjsefnie-Actions/test-ratchet/run@96562a47e9b7fe74b55cc70a4636d1b5d7b542e2 # v2.4.2
        with:
          runner: pytest
          tests: tests/**/test_*.py
          times: .github/test-times.json
          cell: ${{ matrix.os }}-py${{ matrix.python }}
          shard: ${{ matrix.shard }}
          source: .

  report:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && format('{0}-push', github.event.repository.default_branch) || '' }}
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Nitjsefnie-Actions/test-ratchet/report@96562a47e9b7fe74b55cc70a4636d1b5d7b542e2 # v2.4.2
        with:
          github-token: ${{ github.token }}
          cell: ubuntu-latest-py3.15
          times: .github/test-times.json
          push-key: ${{ secrets.MASTER_PUSH_DEPLOY_KEY }}

  comment-share:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && format('{0}-push', github.event.repository.default_branch) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Judge the PR's own tree, including its local action. Full history
          # carries the base object without depending on retained credentials.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the push key on a main push
        if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
        env:
          COMMENT_RATCHET_PUSH_KEY_SET: ${{ secrets.MASTER_PUSH_DEPLOY_KEY != '' }}
        # run.py fails a keyless push only on loose records; this fails any.
        run: |
          if [ "$COMMENT_RATCHET_PUSH_KEY_SET" != 'true' ]; then
            echo 'MASTER_PUSH_DEPLOY_KEY reads empty, so this push cannot commit its records.'
            exit 1
          fi
      - name: Check or tighten this tree with its own action
        # The adoption gate explicitly exercises the checked-out PR head.
        uses: ./ # zizmor: ignore[self-repository]
        with:
          mode: ${{ github.event_name == 'push' && 'tighten' || 'check' }}
          base-ref: ${{ github.event.pull_request.base.sha || github.sha }}
          require-tight: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
          push-key: ${{ github.event_name == 'push' && secrets.MASTER_PUSH_DEPLOY_KEY || '' }}

  # These calls keep the documented ./ reusable-workflow syntax rather than
  # the newer $/ form zizmor's self-repository audit recommends.
  codeql:
    uses: ./.github/workflows/codeql.yml # zizmor: ignore[self-repository]
    permissions:
      # The caller caps the reusable job's grants. Only analysis uploads
      # need write access; the checkout and tests remain read-only.
      security-events: write
      contents: read
  secrets:
    uses: ./.github/workflows/secrets.yml # zizmor: ignore[self-repository]
  audit:
    uses: ./.github/workflows/audit.yml # zizmor: ignore[self-repository]

  aggregate:
    # Like claudit's aggregate: always report, including after a failed or
    # cancelled ancestor. This tree has no classification skips, so every
    # skipped, failed, cancelled or missing leg must fold red.
    # actionlint reports independently; needs can only name this workflow's legs.
    needs: [plan, test, report, shellcheck, comment-share, codeql, secrets, audit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check no tracked file carries a merge-conflict marker
        # A conflict marker can look like Markdown prose to other gates.
        run: |
          # git grep exits 1 for no match and above 1 for an error: an
          # unreadable tree must never be reported as marker-free.
          found=0
          git grep -nI -E '^(<{7}( |$)|>{7}( |$)|={7}$)' -- . || found=$?
          if [ "$found" -gt 1 ]; then
            echo "git grep exited $found, so no marker was looked for."
            exit "$found"
          fi
          if [ "$found" -eq 0 ]; then
            echo 'A merge-conflict marker is committed. Resolve it before merging.'
            exit 1
          fi
      - name: Fold the leg results into one verdict
        env:
          COMMENT_RATCHET_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/aggregate_gate.py
