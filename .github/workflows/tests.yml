name: tests

# Linux-only checks cannot establish macOS portability. Both POSIX legs run
# the same real-subprocess suite with Python and the locked JS tokenizer.
# Contribution events live here so one aggregate can need every gate leg.
on:
  push:
    # A PR head already runs below: an unfiltered push schedules the same
    # commit a second time under another ref, beyond concurrency's reach.
    branches: [main]
  # Required checks must report even on documentation-only PRs. A trigger
  # path filter would leave their context missing and block the merge.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing pushes; later steps must not inherit a stored token.
          persist-credentials: false
      # ShellCheck ships with the image. A missing binary fails in seconds;
      # an apt mirror fetch could instead hang until the job timeout.
      - name: Check every shell file
        # Recurse so a nested test helper cannot silently escape lint.
        run: find tests -type f -name '*.sh' -exec shellcheck {} +

  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in .git/config
          # lets any later subprocess reuse it.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.17.0'
          package-manager-cache: false
      - name: Install the regression toolchain
        # --require-hashes pins artifacts as well as versions. npm ci takes
        # the committed lockfile and verifies its integrity fields.
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r requirements-test.txt
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the regression suite
        # Measure exactly one cell so the figure names one reproducible
        # environment. The subprocess patch reaches isolated CLI children;
        # wrapping the shell runner itself would measure none of its Python.
        env:
          MEASURE_COVERAGE: ${{ matrix.os == 'ubuntu-latest' }}
          COVERAGE_SOURCE_ROOT: ${{ github.workspace }}
          COVERAGE_FILE: ${{ runner.temp }}/comment-ratchet-coverage/.coverage
        run: |
          if [ "$MEASURE_COVERAGE" = 'true' ]; then
            mkdir -p "$RUNNER_TEMP/comment-ratchet-coverage"
            python3 -m coverage run --rcfile=.coveragerc -m pytest -q
          else
            tests/run.sh
          fi
      - name: Record Python coverage
        if: success() && matrix.os == 'ubuntu-latest'
        env:
          COVERAGE_SOURCE_ROOT: ${{ github.workspace }}
          COVERAGE_FILE: ${{ runner.temp }}/comment-ratchet-coverage/.coverage
        run: |
          python3 -m coverage combine --rcfile=.coveragerc
          python3 -m coverage report --rcfile=.coveragerc --format=markdown --precision=1 >> "$GITHUB_STEP_SUMMARY"
      # Ship the same measurement as the summary: the PR-only diff-coverage
      # job reads it without rerunning the suite. Artifact names share one
      # run-wide namespace, and this matrix has exactly one uploading cell
      # for coverage-xml, so the name identifies one measurement.
      - name: Write the coverage XML
        if: matrix.os == 'ubuntu-latest'
        env:
          COVERAGE_SOURCE_ROOT: ${{ github.workspace }}
          COVERAGE_FILE: ${{ runner.temp }}/comment-ratchet-coverage/.coverage
        run: python3 -m coverage xml --rcfile=.coveragerc -o coverage.xml

      - name: Upload the coverage XML
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  # Of the added lines coverage considers executable, how many the suite
  # reached. Informational: refactors and deletion-only changes need a
  # reviewer's judgment, so this job stays outside the aggregate gate.
  # A skipped or failed suite must never be reported as a measurement.
  diff-coverage:
    needs: suites
    if: ${{ !cancelled() && needs.suites.result == 'success' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The statement analyzer reads the same config as the measured cell.
      COVERAGE_SOURCE_ROOT: ${{ github.workspace }}

    # This job checks out and runs code from the pull request (the script
    # below is the pull request's own copy), so it must not carry a token
    # that can write conversation. The trusted coverage-comment workflow
    # owns that token.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit the event named -- the exact SHA the suites job
          # measured -- and not `refs/pull/N/merge` resolved now, which could
          # hand this job a different tree than the one the report describes
          # if GitHub recomputed the merge ref between the two jobs. Full
          # history, because the diff below needs HEAD^1, the base tip that
          # was merged into it.
          ref: ${{ github.sha }}
          fetch-depth: 0
          # Nothing in this job pushes; later steps must not inherit a stored
          # token.
          persist-credentials: false

      - name: Download the coverage XML
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-xml

      # Lift only coverage's block from the hash-pinned test manifest: this
      # job needs its statement analyzer, not the rest of the suite tooling.
      # A venv also works on PEP 668 images whose system Python refuses pip
      # installs. No startup hook or COVERAGE_PROCESS_START: no suite runs
      # here, so there is nothing to measure, only a report to read.
      - name: Install coverage tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/coverage-venv"
          awk '/^coverage==/{f=1} f{print; if ($0 !~ /\\$/) exit}' requirements-test.txt > "$RUNNER_TEMP/coverage.txt"
          "$RUNNER_TEMP/coverage-venv/bin/python" -m pip install --require-hashes -r "$RUNNER_TEMP/coverage.txt"
          echo "PATH=$RUNNER_TEMP/coverage-venv/bin:$PATH" >> "$GITHUB_ENV"

      - name: Measure the coverage of this change
        # HEAD is the merge tree checked out above and HEAD^1 is, by
        # construction, the base tip that was merged into it. The event
        # payload's `base.sha` is NOT that: the base branch can advance
        # between the event and the checkout, and every base commit merged in
        # since would then be reported as a line this pull request added.
        run: |
          git diff --text --no-ext-diff --no-textconv --unified=0 HEAD^1 HEAD > patch.diff
          python3 .github/scripts/diff_coverage.py \
            --coverage coverage.xml \
            --diff patch.diff > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package the comment for the trusted commenter
        # Through env, never interpolation: the number is event data, and a
        # run: block that inlined it would be program text built from input.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf '%s\n' "$PR_NUMBER" > pr-number.txt

      - name: Upload the comment for the trusted commenter
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-comment
          path: |
            body.md
            pr-number.txt
          if-no-files-found: error

  comment-share:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Judge the PR's own tree, including its local action. Full history
          # carries the base object without depending on retained credentials.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check this tree with its own action
        # The adoption gate explicitly exercises the checked-out PR head.
        uses: ./ # zizmor: ignore[self-repository]
        with:
          mode: check
          base-ref: ${{ github.event.pull_request.base.sha || github.sha }}

  # The pinned actionlint accepts the documented ./ reusable-workflow syntax;
  # zizmor's newer $/ recommendation is unsupported by that pinned parser.
  codeql:
    uses: ./.github/workflows/codeql.yml # zizmor: ignore[self-repository]
    permissions:
      # The caller caps the reusable job's grants. Only analysis uploads
      # need write access; the checkout and tests remain read-only.
      security-events: write
      contents: read
  secrets:
    uses: ./.github/workflows/secrets.yml # zizmor: ignore[self-repository]
  audit:
    uses: ./.github/workflows/audit.yml # zizmor: ignore[self-repository]

  aggregate:
    # Like claudit's aggregate: always report, including after a failed or
    # cancelled ancestor. This tree has no classification skips, so every
    # skipped, failed, cancelled or missing leg must fold red.
    # actionlint reports independently; needs can only name this workflow's legs.
    needs: [suites, shellcheck, comment-share, codeql, secrets, audit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check no tracked file carries a merge-conflict marker
        # A conflict marker can look like Markdown prose to other gates.
        run: |
          # git grep exits 1 for no match and above 1 for an error: an
          # unreadable tree must never be reported as marker-free.
          found=0
          git grep -nI -E '^(<{7}( |$)|>{7}( |$)|={7}$)' -- . || found=$?
          if [ "$found" -gt 1 ]; then
            echo "git grep exited $found, so no marker was looked for."
            exit "$found"
          fi
          if [ "$found" -eq 0 ]; then
            echo 'A merge-conflict marker is committed. Resolve it before merging.'
            exit 1
          fi
      - name: Fold the leg results into one verdict
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/aggregate_gate.py

  ratchet:
    # Staging is keyless and follows the whole gate, not just one matrix cell.
    # A records-only push runs this once more, but the no-change stage below
    # emits no artifact and terminates the push chain.
    needs: aggregate
    if: >-
      success() && needs.aggregate.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tighten records after the green gate
        uses: ./ # zizmor: ignore[self-repository] exercise this run's checked-out action
        with:
          mode: tighten
      - name: Stage changed records for the separate push workflow
        id: stage
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$BASE_SHA" ]; then
            echo 'Checkout does not match the measured run head' >&2
            exit 1
          fi
          changed=0
          git diff --quiet -- .github/comment-share.json || changed=$?
          if [ "$changed" -gt 1 ]; then
            echo "git diff failed with $changed" >&2
            exit "$changed"
          fi
          if [ "$changed" -eq 0 ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/ratchet-push"
          cp .github/comment-share.json "$RUNNER_TEMP/ratchet-push/comment-share.json"
          printf '%s\n' "$BASE_SHA" > "$RUNNER_TEMP/ratchet-push/base.txt"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Upload the changed records
        if: success() && steps.stage.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ratchet-push
          path: ${{ runner.temp }}/ratchet-push
          if-no-files-found: error
          retention-days: 1
