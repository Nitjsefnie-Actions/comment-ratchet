# The [extend] line is load-bearing: it keeps gitleaks's default rules as
# the gate. An allowlist file that replaces the default rules would
# silently narrow the gate to nothing, so nothing here replaces them.
#
# Nitjsefnie-Actions/secret-scan reads this file and .gitleaksignore from the
# commit the change is judged against, never the judged tree, and runs the
# default rules without the allowlists that exempt a file by its path alone.
[extend]
useDefault = true
