# The [extend] line is load-bearing: it keeps gitleaks's default rules as
# the gate. An allowlist file that replaces the default rules would
# silently narrow the gate to nothing, so nothing here replaces them.
#
# The default ruleset scans this repository's full history clean, so no
# allowlist entry exists; the scan also passes --ignore-gitleaks-allow so an
# inline allow comment cannot suppress its own finding. The scan reads this
# file and .gitleaksignore from the base branch, never the judged tree.
[extend]
useDefault = true
