name: Comment ratchet
description: Gate tracked source comment shares with an exact per-file ratchet.
inputs:
  target:
    description: Positive integer percent allowed for files without a record.
    required: false
    default: '15'
  records:
    description: Repository-relative JSON records file.
    required: false
    default: '.github/comment-share.json'
  mode:
    description: auto checks pull requests and tightens default-branch pushes; check or tighten forces one.
    required: false
    default: 'auto'
  base-ref:
    description: Git revision whose records bind a check.
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  require-tight:
    description: true fails a check whose head records differ from what tighten writes, and a default-branch push with loose records and no push-key outside a workflow_call run; false leaves both to the default branch.
    required: false
    default: 'false'
  push-key:
    description: SSH write deploy key; a default-branch push commits the tightened records with it.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.15.1'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24.17.0'
        # Consumer package files must not turn on a dependency cache.
        package-manager-cache: false
    - name: Measure and apply the ratchet
      id: ratchet
      shell: bash
      # Inputs are data: none becomes shell program text. -I keeps consumer
      # modules and PYTHONPATH out of Python's import search path.
      env:
        COMMENT_RATCHET_TARGET: ${{ inputs.target }}
        COMMENT_RATCHET_RECORDS: ${{ inputs.records }}
        COMMENT_RATCHET_MODE: ${{ inputs.mode }}
        COMMENT_RATCHET_BASE_REF: ${{ inputs.base-ref }}
        COMMENT_RATCHET_REQUIRE_TIGHT: ${{ inputs.require-tight }}
        COMMENT_RATCHET_PUSH_KEY_SET: ${{ inputs.push-key != '' }}
        COMMENT_RATCHET_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        COMMENT_RATCHET_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
      run: |
        python3 -I "$GITHUB_ACTION_PATH/run.py" --validate-only
        runtime_dir="$(mktemp -d "$RUNNER_TEMP/comment-ratchet.XXXXXX")"
        python3 -I -m venv "$runtime_dir"
        "$runtime_dir/bin/python" -I -m pip install --require-hashes --only-binary=:all: -r "$GITHUB_ACTION_PATH/requirements.txt"
        npm ci --prefix "$GITHUB_ACTION_PATH" --ignore-scripts --no-audit --no-fund
        "$runtime_dir/bin/python" -I "$GITHUB_ACTION_PATH/run.py"
    - name: Push the tightened records
      if: steps.ratchet.outputs.changed == 'true'
      shell: bash
      # The key reaches this step alone, never the measuring one.
      env:
        COMMENT_RATCHET_PUSH_KEY: ${{ inputs.push-key }}
        COMMENT_RATCHET_RECORDS: ${{ inputs.records }}
        COMMENT_RATCHET_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: python3 -I "$GITHUB_ACTION_PATH/scripts/ci/push_records.py"
